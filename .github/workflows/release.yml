name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out Release Tag
        uses: actions/checkout@v6

      - name: Set Up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Release Keystore
        env:
          GYMLOG_KEYSTORE_BASE64: ${{ secrets.GYMLOG_KEYSTORE_BASE64 }}
        run: |
          test -n "$GYMLOG_KEYSTORE_BASE64"
          echo "$GYMLOG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gymlog-release.keystore"

      - name: Build Signed Release Assets
        working-directory: app
        env:
          GYMLOG_KEYSTORE_FILE: ${{ runner.temp }}/gymlog-release.keystore
          GYMLOG_KEYSTORE_PASSWORD: ${{ secrets.GYMLOG_KEYSTORE_PASSWORD }}
          GYMLOG_KEY_ALIAS: ${{ secrets.GYMLOG_KEY_ALIAS }}
          GYMLOG_KEY_PASSWORD: ${{ secrets.GYMLOG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/GymLog-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/GymLog-${GITHUB_REF_NAME#v}.aab"
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/release-assets/* \
            --title "GymLog $GITHUB_REF_NAME" \
            --generate-notes