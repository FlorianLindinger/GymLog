name: Verify Android App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-helpers:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Test Windows Helpers Without a Device
        shell: powershell
        run: |
          Get-ChildItem scripts/windows/tests -Filter '*.Tests.ps1' | ForEach-Object {
            & powershell -STA -NoProfile -ExecutionPolicy Bypass -File $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Helper test failed: $($_.Name)" }
          }

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Compilation, Tests, Lint, and Debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
